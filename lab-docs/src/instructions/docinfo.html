<style>
/* ===== ZENIKA BRAND VARIABLES ===== */
:root {
  --zk-red: #EE2238;
  --zk-red-dark: #BF1D67;
  --zk-black: #1E1E1E;
  --zk-sidebar-width: 20em;
  --zk-white: #ffffff;
  --zk-light-bg: #f9f9f9;
  --zk-border: #e8e8e8;
  --zk-text: #2c2c2c;
  --zk-text-muted: #666;
  --zk-code-bg: #f4f4f5;
}

/* ===== GOOGLE FONT IMPORT FALLBACK ===== */
body {
  font-family: 'Noto Serif', 'DejaVu Serif', serif;
  color: var(--zk-text);
  background: #fff;
  line-height: 1.7;
}

/* ===== HEADINGS — NUNITO ===== */
h1, h2, h3, h4, h5, h6,
#toctitle,
.sidebarblock > .content > .title {
  font-family: 'Nunito', 'Open Sans', sans-serif;
  font-weight: 700;
  color: var(--zk-black);
  letter-spacing: -0.01em;
}

/* Main page H1 */
#header > h1:first-child {
  font-family: 'Nunito', sans-serif;
  font-size: 2rem;
  font-weight: 800;
  color: var(--zk-black);
  border-bottom: 3px solid var(--zk-red);
  padding-bottom: 0.75rem;
  margin-top: 2rem;
  margin-bottom: 1.5rem;
}

/* Section headings */
h2 {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--zk-red);
  border-bottom: 2px solid var(--zk-border);
  padding-bottom: 0.5rem;
  margin-top: 2.5rem;
  margin-bottom: 0.75rem;
  letter-spacing: -0.02em;
}

h3 {
  font-size: 1.2rem;
  font-weight: 700;
  color: #1E1E1E;
  margin-top: 1.75rem;
  margin-bottom: 0.5rem;
  padding-left: 0.75rem;
  border-left: 3px solid var(--zk-red);
}

h4 {
  font-weight: 700;
  color: #3a3a3a;
  margin-top: 1.25rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 1.2rem;
}

#toctitle, .sidebarblock > .content > .title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--zk-black);
}

/* Anchor links in headings */
#content h1 > a.link,
h2 > a.link,
#toctitle > a.link,
.sidebarblock > .content > .title > a.link {
  color: var(--zk-red);
  text-decoration: none;
}
h3 > a.link,
h4 > a.link, h5 > a.link, h6 > a.link {
  color: var(--zk-black);
  text-decoration: none;
}
#content h1 > a.link:hover,
h2 > a.link:hover {
  color: var(--zk-red-dark);
}
h3 > a.link:hover {
  color: var(--zk-red);
}

/* ===== SIDEBAR / TOC ===== */
@media screen and (min-width: 768px) {
  body.toc2 {
    padding-left: var(--zk-sidebar-width);
  }

  #toc.toc2 {
    width: var(--zk-sidebar-width);
    background: var(--zk-black);
    border-right: none;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
}

@media screen and (min-width: 1280px) {
  body.toc2 {
    padding-left: var(--zk-sidebar-width);
  }
  #toc.toc2 {
    width: var(--zk-sidebar-width);
  }
}

/* ===== MOBILE RESPONSIVE ===== */
@media screen and (max-width: 767px) {
  /* Stack sidebar above content, full width, keep dark bg */
  body.toc2 {
    padding-left: 0 !important;
    background: #fff;
  }

  /* Sidebar: full-width dark header block */
  #toc.toc2 {
    position: relative !important;
    width: 100% !important;
    height: auto !important;
    flex-direction: column;
    background: var(--zk-black) !important;
    border-right: none;
    border-top: 3px solid var(--zk-red);
    border-bottom: none;
  }

  /* Brand stays visible */
  #zk-sidebar-brand {
    padding: 1rem 1.25rem 0.5rem;
    font-size: 0.95rem;
    color: #fff;
    display: block;
  }
  #zk-sidebar-brand span {
    font-size: 0.58rem;
    color: var(--zk-red);
    display: block;
  }

  /* TOC title */
  #toc.toc2 #toctitle {
    color: rgba(255,255,255,0.4) !important;
    padding: 0.5rem 1.25rem 0.25rem;
  }

  /* TOC list — vertical list, same as desktop */
  #toc.toc2 > ul {
    display: block !important;
    padding: 0 0 0.75rem !important;
    margin: 0;
    overflow-x: visible;
  }

  #toc.toc2 ul li {
    border-bottom: 1px solid rgba(255,255,255,0.06) !important;
    flex-shrink: unset;
  }

  #toc.toc2 ul li a {
    display: flex !important;
    align-items: flex-start !important;
    white-space: normal !important;
    padding: 0.65rem 1.25rem 0.65rem 1.5rem !important;
    font-size: 0.82rem !important;
    color: rgba(255,255,255,0.75) !important;
    background: none;
    border-radius: 0;
    border: none !important;
    border-left: 3px solid transparent !important;
    line-height: 1.45;
    gap: 0.5rem;
  }
  #toc.toc2 ul li a::before {
    display: inline-block !important;
    flex-shrink: 0;
    width: 1.2rem;
    color: rgba(255,255,255,0.3);
    font-size: 0.75rem;
    font-weight: 700;
    padding-top: 0.05rem;
  }
  #toc.toc2 ul li a:hover {
    background: rgba(238,34,56,0.12) !important;
    color: #fff !important;
    border-left-color: var(--zk-red) !important;
    border: none !important;
    border-left: 3px solid var(--zk-red) !important;
  }
  #toc.toc2 ul li a.active {
    background: rgba(238,34,56,0.18) !important;
    color: #fff !important;
    border: none !important;
    border-left: 3px solid var(--zk-red) !important;
  }

  /* Hide logo/copyright on mobile */
  #zk-sidebar-logo { display: none !important; }

  /* Main content */
  #content, #header {
    padding: 1rem 1.25rem !important;
    margin: 0 !important;
    background: #fff;
    color: #2c2c2c;
  }

  /* All text in content area — dark on white */
  #header h1,
  #content h1, #content h2, #content h3,
  #content h4, #content h5, #content h6,
  #content p, #content li, #content td, #content th,
  #content .paragraph, #content .ulist,
  #content .olist, #content .dlist,
  #content .admonitionblock,
  #content .sectionbody,
  .sect1, .sect2, .sect3 {
    color: #2c2c2c !important;
  }

  /* Preserve contrast for dark table headers on narrow screens. */
  #content table.tableblock thead th,
  #content table.tableblock thead td {
    color: #fff !important;
  }

  /* Headings scale down */
  #header > h1:first-child { font-size: 1.4rem !important; }
  h2 { font-size: 1.15rem !important; }
  h3 { font-size: 1rem !important; }

  /* Code blocks scroll horizontally */
  .listingblock > .content > pre,
  .literalblock pre {
    overflow-x: auto !important;
    font-size: 0.78rem !important;
    -webkit-overflow-scrolling: touch;
  }

  /* Tables scroll horizontally */
  table.tableblock {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Footer */
  #footer {
    background: var(--zk-black) !important;
  }
  #footer-text {
    color: rgba(255,255,255,0.4) !important;
  }
}

/* Sidebar inner padding wrapper */
#toc.toc2::before {
  content: "";
  display: block;
  height: 28px;
}

/* TOC Title — "AI-Driven Development" label */
#toc.toc2 #toctitle {
  font-family: 'Nunito', sans-serif;
  font-size: 0.65rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.4);
  padding: 1.25rem 1.5rem 0.5rem;
  margin: 0;
  border-bottom: none;
}

/* Fake section label above TOC links */
#toc.toc2::after {
  display: none;
}

/* Inject "AI-Driven Development" heading via JS — done below */

/* TOC list */
#toc.toc2 > ul {
  padding: 0 0 1rem;
  margin: 0;
  flex: 1;
  font-size: 0.875rem;
}

#toc.toc2 ul li {
  margin: 0;
  padding: 0;
  list-style: none;
  line-height: 1.45;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

#toc.toc2 ul li a {
  display: flex;
  align-items: flex-start;
  padding: 0.65rem 1.25rem 0.65rem 1.5rem;
  color: rgba(255, 255, 255, 0.75);
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.82rem;
  text-decoration: none;
  transition: background 0.15s, color 0.15s, border-left 0.15s;
  border-left: 3px solid transparent;
  line-height: 1.45;
  gap: 0.5rem;
}

/* Number prefix — fixed width so text always aligns */
#toc.toc2 ul li a::before {
  content: attr(data-num);
  flex-shrink: 0;
  width: 1.2rem;
  color: rgba(255,255,255,0.3);
  font-size: 0.75rem;
  font-weight: 700;
  padding-top: 0.05rem;
}

#toc.toc2 ul li a:hover {
  background: rgba(238, 34, 56, 0.12);
  color: #fff;
  border-left-color: var(--zk-red);
}

/* Active link (scrollspy via JS class below) */
#toc.toc2 ul li a.active,
#toc.toc2 ul li.is-active > a {
  background: rgba(238, 34, 56, 0.18);
  color: #fff;
  border-left-color: var(--zk-red);
}

/* Nested (sectlevel2) */
#toc.toc2 ul ul {
  padding-left: 0;
}
#toc.toc2 ul ul li a {
  padding-left: 2.25rem;
  font-size: 0.8rem;
  font-weight: 400;
  color: rgba(255,255,255,0.5);

#toc.toc2 ul ul li a::before {
  width: 1.6rem;
  font-weight: 600;

#toc.toc2 ul ul li a:hover {
  color: rgba(255,255,255,0.85);

  flex-direction: column;

#zk-sidebar-copyright {
  margin: 0.6rem 0 0;

/* Sidebar top brand label */
#zk-sidebar-brand {
  padding: 1.5rem 1.5rem 0.25rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  color: #fff;
  letter-spacing: -0.01em;

#zk-sidebar-brand span {
  display: block;

}

/* Red top accent bar on sidebar */
#toc.toc2 {
  border-top: 3px solid var(--zk-red);
}

/* ===== LINKS ===== */
a {
  color: var(--zk-red);

}
a:hover, a:focus {
  color: var(--zk-red-dark);
  text-decoration: underline;
}

/* ===== CODE BLOCKS ===== */
.literalblock pre,
.listingblock > .content > pre,
.listingblock > .content > pre.highlight,
.listingblock > .content > pre[class^="highlight "] {
  background: #1a1a2e;
  color: #e0e0e0;

  border-left: 4px solid var(--zk-red);
  font-size: 0.875em;
  padding: 1.25em 1.5em;
}

.listingblock code[data-lang]::before {
  color: var(--zk-red);
  opacity: 0.8;

  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: 0.08em;
}

:not(pre).nobreak code,
:not(pre):not([class^=L]) > code {
  background: #f0f0f2;
  color: var(--zk-red-dark);
  border-radius: 4px;
  padding: 0.1em 0.45em;
  font-size: 0.88em;
  border: 1px solid #e0e0e4;
}

/* ===== ADMONITION BLOCKS ===== */
.admonitionblock.note {
  background: #fff5f7;
  border-left: 4px solid var(--zk-red);
  border-radius: 0 6px 6px 0;
  padding: 1rem 1.25rem;
}

.admonitionblock.note td.content::before {
  content: "ℹ  Note";
  color: var(--zk-red);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.admonitionblock.note code {
  color: var(--zk-red-dark);
  background: rgba(238,34,56,0.08);
  border: none;
}

/* ===== TABLES ===== */
table.tableblock {
  border: 1px solid var(--zk-border);
  border-radius: 6px;
  overflow: hidden;
  font-size: 0.9em;
}

table.tableblock thead tr {
  background: var(--zk-black);
  color: #fff;
}

table.tableblock thead tr th,
table.tableblock thead tr td {
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.75em 1em;
}

table.tableblock tbody tr:nth-child(even) {
  background: #fafafa;
}

table.tableblock tbody tr td {
  padding: 0.65em 1em;
  border-color: var(--zk-border);
}

/* ===== SECTION DIVIDERS ===== */
.sect1 + .sect1 {
  border-top: 2px solid var(--zk-border);
  padding-top: 1.5em;
}

/* ===== FOOTER ===== */
#footer {
  background: var(--zk-black);
  padding: 1.25em 2em;
  margin-top: 2em;
}
#footer-text {
  color: rgba(255,255,255,0.5);
  font-family: 'Nunito', sans-serif;
  font-size: 0.8rem;
}

/* ===== COPY BUTTON — inside dark code box ===== */
/* The pre is position:relative so the button sits inside it */
.listingblock > .content {
  position: relative;
}
.copy-button {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 10;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 5px;
  width: 28px;
  height: 28px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s, background 0.2s;
  line-height: 0;
}
.listingblock:hover .copy-button,
.exampleblock:hover .copy-button {
  opacity: 1;
}
.copy-button:hover {
  background: rgba(238,34,56,0.35);
  border-color: rgba(238,34,56,0.5);
}
.copy-button svg {
  width: 14px;
  height: 14px;
  fill: rgba(255,255,255,0.8);
  display: block;
}
.copy-button.copied svg {
  fill: #50c878;
}
/* Lang label: push down below button on hover so they don't overlap */
.listingblock code[data-lang]::before {
  top: 38px !important;
}

/* ===== TABS ===== */
.tablist > ul li {
  border-color: var(--zk-border);
  font-family: 'Nunito', sans-serif;
}
.tabs.is-loading .tablist li:not(:first-child),
.tabs:not(.is-loading) .tablist li:not(.is-selected) {
  background-color: #f5f5f5;
}
.tabs:not(.is-loading) .tablist li.is-selected {
  background-color: #fff;
  border-top: 2px solid var(--zk-red);
}

/* ===== EXAMPLE/SIDEBAR BLOCKS ===== */
.exampleblock > .content {
  border: none;
  background: none;
  padding: 0;
}
.sidebarblock {
  border: 1px solid var(--zk-border);
  border-radius: 6px;
  background: #f7f7f8;
  border-left: 4px solid var(--zk-black);
}

/* copy button overlap fix — superseded */

/* ===== SYNTAX HIGHLIGHT — fix low-contrast purple ===== */
/* Override common purple/violet token colours with high-contrast alternatives */
.listingblock pre .hljs-keyword,
.listingblock pre .hljs-selector-tag,
.listingblock pre .hljs-built_in,
.listingblock pre .hljs-name,
.listingblock pre .hljs-tag,
pre .kw, pre .keyword,
code .kw, code .keyword {
  color: #79d4f5 !important; /* bright cyan — readable on dark bg */
}
.listingblock pre .hljs-attr,
.listingblock pre .hljs-attribute,
pre .at, code .at {
  color: #f7c948 !important; /* amber */
}
.listingblock pre .hljs-string,
pre .st, code .st {
  color: #95e6a0 !important; /* soft green */
}
.listingblock pre .hljs-comment,
pre .co, code .co {
  color: #8899aa !important;
  font-style: italic;
}
/* Generic: anything that ends up purple (#a0? or hsl(270-290)) — catch-all via filter trick isn't possible in CSS,
   but CodeRay uses specific span classes we can target */
pre span.r,  /* Ruby keyword */
pre span.kp, /* keyword pseudo */
pre span.nb  /* name builtin */ {
  color: #79d4f5 !important;
}
pre span.s,  /* string */
pre span.s1,
pre span.s2 {
  color: #95e6a0 !important;
}
pre span.c,  /* comment */
pre span.c1,
pre span.cm {
  color: #8899aa !important;
  font-style: italic;
}
/* CodeRay specific classes used in this doc */
.CodeRay .keyword   { color: #79d4f5 !important; font-weight: bold; }
.CodeRay .constant  { color: #f7c948 !important; }
.CodeRay .string    { color: #95e6a0 !important; }
.CodeRay .comment   { color: #8899aa !important; font-style: italic; }
.CodeRay .integer   { color: #ffb86c !important; }
.CodeRay .float     { color: #ffb86c !important; }
.CodeRay .symbol    { color: #ff9580 !important; }
.CodeRay .regex     { color: #ff9580 !important; }
.CodeRay .attribute { color: #f7c948 !important; }
.CodeRay .directive { color: #79d4f5 !important; font-weight: bold; }
.CodeRay .tag       { color: #79d4f5 !important; }
.CodeRay .type      { color: #f7c948 !important; }
.CodeRay .class     { color: #f7c948 !important; font-weight: bold; }
.CodeRay .method    { color: #b3f0ff !important; }
.CodeRay .function  { color: #b3f0ff !important; }
/* Catch remaining purple — CodeRay often renders keywords with color:#800 or #088 or violet */
.listingblock pre *, .literalblock pre * {
  /* Don't override everything, but ensure low-contrast purples are replaced */
}
/* Target the specific purple shades CodeRay uses (#d28, #d0f, #93a etc.) via explicit overrides */
.CodeRay span[style*="color:#d2"] { color: #ff9580 !important; }
.CodeRay span[style*="color:#60"] { color: #79d4f5 !important; }
.CodeRay span[style*="color:#06"] { color: #95e6a0 !important; }

  // Fix TOC links: prevent default navigation, use scrollIntoView instead
  var links = toc.querySelectorAll('a[href^="#"]');
  var sections = [];
  links.forEach(function(link) {
    var id = link.getAttribute('href').slice(1);
    var el = document.getElementById(id);
    if (el) sections.push({ el: el, link: link });

    link.addEventListener('click', function(e) {
      e.preventDefault();
      var targetId = this.getAttribute('href').slice(1);
      var target = document.getElementById(targetId);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // Update URL hash without navigation
        if (history.pushState) {
          history.pushState(null, null, '#' + targetId);
        }
      }
    });
  });

  var currentLink = null;

  // Keep the active link visible in the sidebar (it scrolls separately from the page)
  function revealInToc(link) {
    var tocRect = toc.getBoundingClientRect();
    var linkRect = link.getBoundingClientRect();
    var margin = 80;
    if (linkRect.top < tocRect.top + margin || linkRect.bottom > tocRect.bottom - margin) {
      var target = toc.scrollTop + (linkRect.top - tocRect.top) - (toc.clientHeight - linkRect.height) / 2;
      toc.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    }
  }

  function onScroll() {
    var active = null;
    sections.forEach(function(s) {
      if (s.el.getBoundingClientRect().top <= 120) active = s;
    });
    // At the bottom of the page, the last section is the active one
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2 && sections.length) {
      active = sections[sections.length - 1];
    }
    var link = active ? active.link : null;
    if (link === currentLink) return;
    links.forEach(function(l) { l.classList.remove('active'); });
    if (link) {
      link.classList.add('active');
      revealInToc(link);
    }
    currentLink = link;
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();

// Copy button for code blocks
document.addEventListener('DOMContentLoaded', function() {
  var COPY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="rgba(255,255,255,0.8)" d="M208 0H332.1c12.7 0 24.9 5.1 33.9 14.1l67.9 67.9c9 9 14.1 21.2 14.1 33.9V336c0 26.5-21.5 48-48 48H208c-26.5 0-48-21.5-48-48V48c0-26.5 21.5-48 48-48zM48 128h80v64H64v256h192v-32h64v48c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V176c0-26.5 21.5-48 48-48z"/></svg>';
  var TICK_ICON  = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="#50c878" d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>';

  function showTick(btn) {
    btn.innerHTML = TICK_ICON;
    btn.style.background = 'rgba(80,200,120,0.25)';
    btn.style.borderColor = 'rgba(80,200,120,0.5)';
    btn.style.opacity = '1';
    setTimeout(function() {
      btn.innerHTML = COPY_ICON;
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.opacity = '';
    }, 5000);
  }

  document.querySelectorAll('.listingblock').forEach(function(block) {
    var btn = document.createElement('button');
    btn.className = 'copy-button';
    btn.title = 'Copy to clipboard';
    btn.innerHTML = COPY_ICON;

    btn.addEventListener('click', function() {
      var code = block.querySelector('code');
      var pre  = block.querySelector('pre');
      var text = (code || pre) ? (code || pre).innerText.trim() : '';
      if (!text) return;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function() {
          showTick(btn);
        }).catch(function() {
          fallbackCopy(text, btn);
        });
      } else {
        fallbackCopy(text, btn);
      }
    });

    var target = block.querySelector('.listingblock > .content');
    if (target) {
      target.appendChild(btn);
    } else {
      block.appendChild(btn);
    }
  });

  function fallbackCopy(text, btn) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); showTick(btn); } catch(e) {}
    document.body.removeChild(ta);
  }
});
</script>
